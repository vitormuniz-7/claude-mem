    const ly = (dx * Math.sin(a) + dy * Math.cos(a)) / w * 900 + 462.8;

    this.setState({ level, seq, pos: 0, phase: 'show', showIdx: -1, colorOf, lastResult: '' });
    seq.forEach((_, i) => {
      this.later(() => this.setState({ showIdx: i }), 500 + i * step);
      this.later(() => this.setState({ showIdx: -1 }), 500 + i * step + step * 0.7);
    });
    this.later(() => { this.mode = 'hold'; this.holdUntil = Infinity; this.setState({ phase: 'play' }); }, 500 + seq.length * step + 200);
  }
  confirmMove() {
    if (this.state.phase !== 'play') return;
    const n = this.nearestLeaf(true);
    if (n.d > (this.props.window ?? 16)) return;
    const leafColor = this.state.colorOf[n.i];
    if (leafColor < 0) return;                                // a neutral leaf cannot be confirmed
    const wanted = this.state.seq[this.state.pos];
    if (leafColor === wanted) {
      const pos = this.state.pos + 1;
      if (pos >= this.state.seq.length) {
        this.setState(Object.assign({ pos, phase: 'won', lastResult: 'nível ' + this.state.level + ' ✓' }, this.bumpRecord(this.state.level)));
        this.later(() => this.startLevel(this.state.level + 1), 1100);
      } else {
        this.setState({ pos });
      }
    } else {
      const p = this.panelRef.current;
      if (p) { p.classList.remove('bg-shake'); void p.offsetWidth; p.classList.add('bg-shake'); }
      this.setState(Object.assign({ phase: 'lost', lastResult: 'era ' + this.pal().leaves[wanted].name + ' — você chegou ao nível ' + this.state.level }, this.bumpRecord(this.state.level - 1)));
    }
  }

  // ---------- frame loop ----------
  componentDidMount() {
    const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick = (now) => {
      const dt = this.last ? Math.min((now - this.last) / 1000, 0.05) : 0;
      this.last = now;
      const inGame = this.state.mode === 'game';
      const idle = rm ? 0 : (this.props.idleSpeed ?? 14);
      const win = this.props.window ?? 16;
      const list = inGame ? this.menu.map((m) => m.at) : this.tips;
      const nt = this.nearestTip(list);
      const n = this.nearestLeaf(inGame);
      const assist = !inGame || this.state.level < 4 || this.snapExact;
      const drift = inGame && this.state.level >= 6 && this.state.phase === 'play' && !rm;
      if (!this.drag) {
        if (this.mode === 'settle') {
          this.vel *= Math.exp(-dt * 3.2);
          this.angle += this.vel * dt;
          if (Math.abs(this.vel) < 160) {
            if (assist) {
              const delta = this.tipDelta(list);
              this.angle += delta * Math.min(1, dt * 7);
              if (Math.abs(delta) < 0.15) { this.angle += delta; this.vel = 0; this.mode = 'hold'; this.snapExact = false; }
            } else if (Math.abs(this.vel) < 2) { this.vel = 0; this.mode = 'hold'; }
          }
        } else if (this.mode === 'hold') {
          if (drift) { this.angle += this.dir * 6 * dt; }
          else if (!inGame && now >= this.holdUntil) this.mode = 'idle';
        } else {
          const ease = Math.min(1, nt.d / 40);
          const target = (this.dir < 0 ? -1 : 1) * idle * ((this.props.dwell ?? 0.35) + (1 - (this.props.dwell ?? 0.35)) * ease);
          this.vel += (target - this.vel) * Math.min(1, dt * 1.6);
          this.angle += this.vel * dt;
        }
      }
      const el = this.discRef.current;
      if (el) el.style.transform = 'rotate(' + this.angle.toFixed(2) + 'deg)';

      // closeness of the nearest leaf (half-window 36°) and of the yellow petal (half-window 22°)
      const t = Math.min(1, n.d / 36);
      const c = Math.pow(1 - t, 2);
      const dp = this.dist(this.petalAt);
      const tp = Math.min(1, dp / 22);
      const cp = inGame ? 0 : Math.pow(1 - tp, 2);
      const gameTop = !inGame && cp > c;                   // the petal is the active notch
      const g = [35, 91, 67], hi = [46, 158, 110], gold = [181, 125, 28], yel = [242, 188, 106];
      const mix = (a, b, k) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',') + ')';
      const col = inGame ? this.leafColor(n.i).hex : (gameTop ? mix(g, gold, cp) : mix(g, hi, c));
      const markerCol = inGame ? col : (gameTop ? mix(g, yel, cp) : mix(g, hi, c));
      const term = this.termRef.current;
      if (term && !inGame) {
        const ta = gameTop ? tp : t;
        const ca = gameTop ? cp : c;
        term.style.transform = 'scale(' + (1 - 0.5 * ta * ta).toFixed(3) + ')';
        term.style.opacity = (1 - 0.8 * ta).toFixed(3);
        term.style.color = col;
        term.style.borderColor = col;
        term.style.textDecorationLine = 'underline';
        term.style.textDecorationColor = gameTop ? 'rgba(242,188,106,' + ca.toFixed(3) + ')' : 'rgba(46,158,110,' + ca.toFixed(3) + ')';
      }
      const mk = this.markerRef.current;
      if (mk) {
        mk.style.borderTopColor = markerCol;
        mk.style.transform = 'scale(' + (1 + 0.25 * (gameTop ? cp : c)).toFixed(3) + ')';
      }
      this.menu.forEach((m, i) => {
        const r = this.leafRefs[i].current;
        if (!r) return;
        const ci = Math.pow(1 - Math.min(1, this.dist(m.at) / 36), 2);
        if (inGame) {
          r.style.backgroundColor = this.leafColor(i).hex;
          r.style.opacity = '1';
        } else {
          r.style.backgroundColor = '#2E9E6E';
          r.style.opacity = (gameTop ? 0 : ci).toFixed(3);
        }
      });
      const pr = this.petalRef.current;
      if (pr) pr.style.opacity = (0.75 * cp).toFixed(3);
      // in the game every petal that is not one of the five leaves turns the manual's green
      const pa = this.petalsRef.current;
      if (pa) { pa.style.opacity = inGame ? '1' : '0'; pa.style.backgroundColor = this.center; }
      // the game dot grows in at the right end of the row while the petal nears the top; it shrinks away the same way
      const gd = this.gameDotRef.current;
      if (gd) {
        gd.style.width = (12 * cp).toFixed(2) + 'px';
        gd.style.marginLeft = (-10 + 10 * cp).toFixed(2) + 'px';
        gd.style.opacity = cp.toFixed(3);
      }
      const locked = inGame ? n.d <= win : nt.d <= win;
      if (n.i !== this.state.top || locked !== this.state.locked || gameTop !== this.state.gameTop) this.setState({ top: n.i, locked, gameTop });
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.clearTimers();
  }

  renderVals() {
    const st = this.state;
    const inGame = st.mode === 'game';
    const cur = this.menu[st.top];
    const P = this.pal();
    const topColor = this.leafColor(st.top);
    const topNeutral = st.colorOf[st.top] < 0;
    const dot = (i) => ({
      size: !st.gameTop && i === st.top ? '12px' : '8px',
      color: !st.gameTop && i === st.top ? (st.locked ? '#2E9E6E' : '#235B43') : 'rgba(35,91,67,0.25)'
    });
    const seqDots = st.seq.map((ci, i) => {
      const hidden = st.level >= 3 && st.phase !== 'show' && i >= st.pos;
      const lit = st.phase === 'show' ? i === st.showIdx : i < st.pos;
      const hex = P.leaves[ci].hex;
      const edge = this.lum(hex) > 0.8 ? '#1E1E1E' : hex;   // very light colours need a dark edge on the lavender page
      return {
        bg: (st.phase === 'show' && i !== st.showIdx) ? 'transparent' : (hidden ? 'transparent' : hex),
        border: hidden || (st.phase === 'show' && i !== st.showIdx) ? '#235B43' : edge,
        scale: lit ? 1.25 : 1
      };
    });
    let prompt = '';
    if (st.phase === 'show') prompt = 'memorize a sequência';
    else if (st.phase === 'play') prompt = 'gire a cor ' + (st.pos + 1) + ' de ' + st.seq.length + ' para cima';
    else prompt = st.lastResult;
    return {
      inMenu: !inGame, inGame,
      menuGap: this.props.menuGap ?? 12,
      topHint: inGame ? 'cor no topo: ' + topColor.name : 'gire a flor',
      discAria: inGame ? 'Gire a flor até a cor certa ficar no topo, ou clique numa folha para trazê-la ao topo. Cor no topo: ' + topColor.name : 'Girar a bromélia. Arraste como um disco, clique numa folha para trazê-la ao topo, ou use as setas: a ponta que chega ao topo escolhe o menu.',
      discRef: this.discRef, termRef: this.termRef, markerRef: this.markerRef, gameDotRef: this.gameDotRef, petalRef: this.petalRef, petalsRef: this.petalsRef, panelRef: this.panelRef,
      leaves: this.menu.map((m, i) => ({ cls: 'lf' + i, ref: this.leafRefs[i] })),
      termLabel: st.gameTop ? 'jogar' : cur.label,
      showSub: !st.gameTop && st.locked && !!cur.sub,
      subItems: cur.sub || [],
      termHref: st.gameTop ? '#' : cur.href,
      termClick: (e) => { if (st.gameTop) { e.preventDefault(); this.startGame(); } },
      dots: [0, 1, 2, 3, 4].filter((i) => this.menu[i].label).map(dot),
      // game
      level: st.level, record: st.record, seqDots, prompt,
      promptColor: st.phase === 'lost' ? '#D9483B' : (st.phase === 'won' ? '#2E9E6E' : '#1E1E1E'),
      showConfirm: st.phase === 'play' || st.phase === 'show' || st.phase === 'won',
      confirmDisabled: st.phase !== 'play' || !st.locked || topNeutral,
      confirmLabel: st.phase === 'play' ? (st.locked ? (topNeutral ? 'essa folha é neutra' : 'confirmar ' + topColor.name) : 'encaixe uma cor no topo') : (st.phase === 'won' ? 'próximo nível…' : 'observe…'),
      topColorHex: st.phase === 'play' && st.locked && !topNeutral ? topColor.hex : '#235B43',
      topColorBorder: st.phase === 'play' && st.locked && !topNeutral ? (this.lum(topColor.hex) > 0.8 ? '#1E1E1E' : topColor.hex) : '#235B43',
      topColorText: st.phase === 'play' && st.locked && !topNeutral ? topColor.text : '#F4F3FA',
      showRetry: st.phase === 'lost',
      showQuit: st.phase !== 'lost',
      startGame: () => this.startGame(),
      quitGame: () => this.quitGame(),
      confirm: () => this.confirmMove(),
      // flower controls
      discDown: (e) => {
        const box = e.currentTarget.getBoundingClientRect();
        e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
        this.drag = { box, a: this.pointerAngle(e, box), t: performance.now(), moved: 0, net: 0, x: e.clientX, y: e.clientY };
        this.vel = 0;
        this.touch();
      },
      discMove: (e) => {
        const d = this.drag;
        if (!d) {
          const hit = this.tipUnder(e.clientX, e.clientY, e.currentTarget.getBoundingClientRect());
          e.currentTarget.style.cursor = hit !== null ? 'pointer' : 'grab';
          return;
        }
        const a = this.pointerAngle(e, d.box);
        let delta = a - d.a;
        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;
        const now = performance.now();
        const dt = Math.max((now - d.t) / 1000, 0.001);
        this.angle += delta;
        this.vel = this.vel * 0.6 + (delta / dt) * 0.4;
        d.a = a; d.t = now; d.moved += Math.abs(delta); d.net += delta;
        this.touch(now);
      },
      discUp: () => {
        const d = this.drag;
        this.drag = null;
        if (d && d.moved < 6) {
          // a tap on a leaf brings that leaf to the top by the shortest way (menu and game alike)
          const at = this.tipUnder(d.x, d.y, d.box);
          if (at !== null) { this.snapToAngle(at, 0); if (inGame) this.holdUntil = Infinity; return; }
          if (inGame) { this.mode = 'hold'; return; }
          this.stepTip(this.dir);
          return;
        }
        if (d && Math.abs(d.net) > 6) this.dir = d.net > 0 ? 1 : -1;
        else if (Math.abs(this.vel) > 60) this.dir = this.vel > 0 ? 1 : -1;
        this.vel = Math.max(-1800, Math.min(1800, this.vel));
        this.mode = 'settle';
        this.snapExact = false;
        this.touch();
      },
      discKey: (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); this.dir = 1; this.stepTip(1); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); this.dir = -1; this.stepTip(-1); }
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (inGame) this.confirmMove();
          else if (st.gameTop) this.startGame();
          else window.location.href = cur.href;
        }
        if (e.key === 'Escape' && inGame) { e.preventDefault(); this.quitGame(); }
      }
    };
  }
}
</script>
</body>
</html>
